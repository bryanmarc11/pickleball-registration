<section id="business-section">
  <h2><span class="num">6</span> Business Partnership</h2>

  <div class="waiver">
    <strong>Do you have a business?</strong><br>
    Do you want us to promote it?<br>
    Be our partner by just sending us your logo!
  </div>

  <div class="field" data-required-group="has_business">
    <label class="q">Do you have a business? <span class="req">*</span></label>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="has_business" value="yes">
        <span>Yes</span>
      </label>
      <label class="choice">
        <input type="radio" name="has_business" value="no">
        <span>No</span>
      </label>
    </div>
    <div class="error-msg">Please choose one.</div>
  </div>

  <div
    class="field"
    id="promotion-field"
    data-required-group="wants_promotion"
    hidden
  >
    <label class="q">Do you want us to promote it? <span class="req">*</span></label>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="wants_promotion" value="yes" disabled>
        <span>Yes</span>
      </label>
      <label class="choice">
        <input type="radio" name="wants_promotion" value="no" disabled>
        <span>No</span>
      </label>
    </div>
    <div class="error-msg">Please choose one.</div>
  </div>

  <div id="business-extra" hidden>
    <div class="field">
      <label class="q" for="business_name">Business name <span class="req">*</span></label>
      <input
        type="text"
        id="business_name"
        name="business_name"
        maxlength="160"
        disabled
      >
      <div class="error-msg">Please enter the business name.</div>
    </div>

    <div class="field">
      <label class="q" for="business_logo">Upload business logo <span class="req">*</span></label>
      <p class="help">Accepted: JPG, PNG, WebP · Maximum 2 MB</p>

      <label class="upload-box" for="business_logo">
        <span id="business_logo_label">Choose logo image</span>
      </label>

      <input
        type="file"
        id="business_logo"
        name="business_logo"
        accept="image/jpeg,image/png,image/webp"
        disabled
        hidden
      >

      <div class="error-msg">Please upload a valid image file under 2 MB.</div>

      <div id="logo_preview_wrap" hidden>
        <p class="help">Preview</p>
        <img id="logo_preview" class="logo-preview" alt="Business logo preview">
      </div>
    </div>
  </div>
</section>
